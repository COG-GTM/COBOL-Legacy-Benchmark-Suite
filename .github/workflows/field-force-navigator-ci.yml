name: Field Force Navigator CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'field-force-navigator/**'
      - '.github/workflows/field-force-navigator-*.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: field-force-navigator

jobs:
  lint-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: field-force-navigator/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage (scoring >= 90% gate)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: field-force-navigator/coverage

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t field-force-navigator:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name ffn -p 8080:8080 field-force-navigator:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'Field Force Navigator'
          docker rm -f ffn
