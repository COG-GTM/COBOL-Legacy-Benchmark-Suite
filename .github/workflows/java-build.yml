name: Java build

on:
  push:
    paths:
      - 'java/**'
      - '.github/workflows/java-build.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/java-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw --batch-mode verify
