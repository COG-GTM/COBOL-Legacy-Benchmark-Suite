name: Java Build

on:
  push:
    branches: [ main, 'devin/**' ]
    paths:
      - 'java/**'
      - '.github/workflows/java-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'java/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Build with Maven
        working-directory: java
        run: mvn clean install -B
        
      - name: Run Tests
        working-directory: java
        run: mvn test -B
