name: Java CI

on:
  push:
    branches: [main]
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: java

jobs:
  verify:
    name: Build, lint, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/**/pom.xml

      - name: Format check (Spotless / google-java-format)
        run: ./mvnw -B -ntp spotless:check

      - name: Lint (Checkstyle)
        run: ./mvnw -B -ntp -DskipTests checkstyle:check

      - name: Build, unit tests, coverage gate
        run: ./mvnw -B -ntp verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: java/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-aggregate
          path: java/clbs-coverage/target/site/jacoco-aggregate/
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          csv=clbs-coverage/target/site/jacoco-aggregate/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9} END {
              total=missed+covered;
              pct=(total>0)?100*covered/total:0;
              printf "### Line coverage (aggregate)\n\n%d / %d lines covered (%.1f%%)\n", covered, total, pct
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          fi
