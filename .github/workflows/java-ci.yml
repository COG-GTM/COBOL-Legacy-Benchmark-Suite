name: Java CI

on:
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"
  push:
    branches:
      - devin/cobol-migration-integration
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        working-directory: java
        run: mvn -q verify
