name: Java CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      working-directory: ./java
      run: mvn clean install -B -V
      
    - name: Run tests
      working-directory: ./java
      run: mvn test -B
      
    - name: Generate JaCoCo coverage report
      working-directory: ./java
      run: mvn jacoco:report
      
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./java/domain-model/target/site/jacoco/jacoco.xml,./java/infrastructure/target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Archive build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: maven-build-artifacts
        path: |
          java/**/target/*.jar
          !java/**/target/*-sources.jar
          !java/**/target/*-javadoc.jar
        retention-days: 7
