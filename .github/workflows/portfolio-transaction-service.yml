name: portfolio-transaction-service

on:
  push:
    paths:
      - 'java-migration/portfolio-transaction-service/**'
      - '.github/workflows/portfolio-transaction-service.yml'
  pull_request:
    paths:
      - 'java-migration/portfolio-transaction-service/**'
      - '.github/workflows/portfolio-transaction-service.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-migration/portfolio-transaction-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean test
