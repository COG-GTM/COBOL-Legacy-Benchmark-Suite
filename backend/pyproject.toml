[project]
name = "portfolio-manager-api"
version = "1.0.0"
description = "Modernized Investment Portfolio Management API - migrated from COBOL Legacy Benchmark Suite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
