# ============================================================
# Investment Portfolio Management System
# Migrated from Enterprise COBOL for z/OS
# ============================================================

spring.application.name=portfolio-management

# ---- Database (PostgreSQL in production, H2 for dev/test) ----
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HikariCP - mirrors original DB2 pool (max 100 connections, 300s timeout)
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.connection-timeout=300000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=PortfolioHikariPool

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ---- Schema initialization ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__init_schema.sql
spring.sql.init.data-locations=classpath:db/migration/V2__seed_data.sql

# ---- Spring Batch ----
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ---- JWT Security ----
app.jwt.secret=portfolio-management-secret-key-for-jwt-auth-cobol-migration-2024
app.jwt.expiration-ms=86400000

# ---- Server ----
server.port=8080
server.servlet.context-path=/

# ---- Logging ----
logging.level.com.portfolio=INFO
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.security=WARN

# ---- OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
