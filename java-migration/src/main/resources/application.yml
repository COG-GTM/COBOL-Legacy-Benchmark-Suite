spring:
  datasource:
    url: jdbc:h2:mem:posmvp;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 10
      pool-name: POSMVP-POOL
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  profiles:
    default: demo
  thymeleaf:
    cache: false
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
