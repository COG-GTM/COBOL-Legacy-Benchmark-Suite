<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction History Inquiry</title>
    <link rel="stylesheet" th:href="@{/css/terminal.css}">
</head>
<body>
<!-- INQSET.bms HISMAP (INQH / INQHIST) -->
<main class="screen">
    <h1 class="bright">Transaction History Inquiry</h1>
    <form method="get" th:action="@{/inquiry/history}">
        <label>Account: <input type="text" name="accountNo" maxlength="10" size="10" th:value="${accountNo}" autofocus></label>
        <button type="submit">Enter</button>
    </form>

    <table class="data" th:if="${rows}">
        <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Units</th>
            <th>Price</th>
            <th>Amount</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}" class="history-row">
            <td class="value" th:text="${#temporals.format(r.id.transDate, 'yyyy-MM-dd')}"></td>
            <td class="value" th:text="${r.transType.code()}"></td>
            <td class="value num" th:text="${#numbers.formatDecimal(r.quantity, 1, 'COMMA', 3, 'POINT')}"></td>
            <td class="value num" th:text="${#numbers.formatDecimal(r.price, 1, 'COMMA', 3, 'POINT')}"></td>
            <td class="value num" th:text="${#numbers.formatDecimal(r.amount, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        </tbody>
    </table>

    <p class="footer">
        <a th:href="@{/menu}">PF3=Exit</a>
        <a th:if="${hasPrevious}" th:href="@{/inquiry/history(accountNo=${accountNo}, page=${page - 1})}">PF7=Previous</a>
        <a th:if="${hasNext}" th:href="@{/inquiry/history(accountNo=${accountNo}, page=${page + 1})}">PF8=Next</a>
    </p>
    <p class="errmsg" th:if="${errmsg}" th:text="${errmsg}"></p>
</main>
</body>
</html>
