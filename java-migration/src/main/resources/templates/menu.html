<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Portfolio Management - Main Menu</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #000; color: #0f0; padding: 20px; }
        h1 { color: #0ff; border-bottom: 2px solid #0ff; padding-bottom: 10px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { padding: 8px 12px; text-align: left; border: 1px solid #0f0; }
        th { background: #003; color: #0ff; }
        a { color: #ff0; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav { margin-top: 20px; }
        .nav a { margin-right: 20px; padding: 5px 10px; border: 1px solid #0f0; }
    </style>
</head>
<body>
<!-- MENMAP - Main Menu (replaces BMS map MENMAP from INQSET.bms) -->
<h1>INVESTMENT PORTFOLIO MANAGEMENT SYSTEM</h1>
<h2>MAIN MENU</h2>

<table>
    <thead>
        <tr>
            <th>Portfolio ID</th>
            <th>Client Name</th>
            <th>Type</th>
            <th>Status</th>
            <th>Total Value</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="p : ${portfolios}">
            <td th:text="${p.portfolioId}"></td>
            <td th:text="${p.clientName}"></td>
            <td th:text="${p.clientType}"></td>
            <td th:text="${p.status}"></td>
            <td th:text="${#numbers.formatDecimal(p.totalValue, 1, 2)}"></td>
            <td>
                <a th:href="@{/portfolio/{id}/positions(id=${p.portfolioId})}">Positions</a> |
                <a th:href="@{/portfolio/{id}/history(id=${p.portfolioId})}">History</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(portfolios)}">
            <td colspan="6">No active portfolios found.</td>
        </tr>
    </tbody>
</table>

<div class="nav">
    <a href="/logout">PF3=Exit</a>
</div>
</body>
</html>
