spring:
  application:
    name: portfolio-system
  
  datasource:
    url: jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.portfolio: DEBUG
    org.springframework.batch: INFO

jwt:
  secret: cG9ydGZvbGlvLXN5c3RlbS1qd3Qtc2VjcmV0LWtleS1mb3ItYXV0aGVudGljYXRpb24tMjAyNA==
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
