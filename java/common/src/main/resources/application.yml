spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:portfolio}
    driver-class-name: org.postgresql.Driver
    # HikariCP pool settings traced from DB2CONN.cbl / DBPROC.cpy semantics:
    # - initialization-fail-timeout 300ms mirrors DB2CONN 1000-CONNECT retry loop
    #   (DB2-MAX-RETRIES=3 x DB2-RETRY-WAIT=100ms from DBPROC.cpy)
    # - validation-timeout bounds the status check that replaces DB2CONN
    #   3000-CHECK-STATUS (SELECT CURRENT SERVER FROM SYSIBM.SYSDUMMY1)
    # - maximum-pool-size guards against SQLCODE -30081 "Maximum connections exceeded"
    hikari:
      pool-name: PortfolioHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 300
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
management:
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
