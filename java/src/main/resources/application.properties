spring.application.name=clbs-java
server.port=8080

# Local stand-in for the DB2 subsystem used by the online and history modules.
spring.datasource.url=jdbc:h2:mem:clbs;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n
