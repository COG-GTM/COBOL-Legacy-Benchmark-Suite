stages:
  - build
  - test
  - quality
  - security
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_REGISTRY: "registry.example.com"
  IMAGE_NAME: "portfolio-service"
  KUBERNETES_NAMESPACE: "portfolio-system"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository
    - .gradle/caches
    - .gradle/wrapper

.maven-job:
  image: maven:3.9-eclipse-temurin-21
  before_script:
    - cd migration/phase1/application/portfolio-service

build:
  extends: .maven-job
  stage: build
  script:
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - migration/phase1/application/portfolio-service/target/
    expire_in: 1 hour

unit-tests:
  extends: .maven-job
  stage: test
  script:
    - mvn test
  artifacts:
    when: always
    paths:
      - migration/phase1/application/portfolio-service/target/surefire-reports/
      - migration/phase1/application/portfolio-service/target/site/jacoco/
    reports:
      junit: migration/phase1/application/portfolio-service/target/surefire-reports/TEST-*.xml
    expire_in: 1 week
  coverage: '/Total.*?([0-9]{1,3})%/'

integration-tests:
  extends: .maven-job
  stage: test
  services:
    - name: postgres:15-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: portfolio_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_test
    SPRING_DATASOURCE_USERNAME: test_user
    SPRING_DATASOURCE_PASSWORD: test_password
    SPRING_REDIS_HOST: redis
  script:
    - mvn verify -DskipUnitTests -Pintegration-tests
  artifacts:
    when: always
    paths:
      - migration/phase1/application/portfolio-service/target/failsafe-reports/
    reports:
      junit: migration/phase1/application/portfolio-service/target/failsafe-reports/TEST-*.xml
    expire_in: 1 week

sonarqube:
  extends: .maven-job
  stage: quality
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn sonar:sonar
        -Dsonar.projectKey=portfolio-service
        -Dsonar.projectName="Portfolio Service"
        -Dsonar.host.url=$SONAR_HOST_URL
        -Dsonar.login=$SONAR_TOKEN
        -Dsonar.java.coveragePlugin=jacoco
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

dependency-check:
  extends: .maven-job
  stage: security
  script:
    - mvn org.owasp:dependency-check-maven:check
  artifacts:
    when: always
    paths:
      - migration/phase1/application/portfolio-service/target/dependency-check-report.html
    expire_in: 1 week
  allow_failure: true

container-scan:
  stage: security
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA migration/phase1/application/portfolio-service/
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
        aquasec/trivy:latest image
        --severity HIGH,CRITICAL
        --exit-code 0
        --format json
        --output trivy-report.json
        $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 1 week
  allow_failure: true

build-image:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest migration/phase1/application/portfolio-service/
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - develop
    - tags

deploy-staging:
  stage: deploy
  image: bitnami/kubectl:1.28
  environment:
    name: staging
    url: https://staging-portfolio.example.com
  script:
    - kubectl config use-context staging
    - kubectl set image deployment/portfolio-service
        portfolio-service=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        -n $KUBERNETES_NAMESPACE-staging
    - kubectl rollout status deployment/portfolio-service
        -n $KUBERNETES_NAMESPACE-staging
        --timeout=300s
  only:
    - develop

deploy-production:
  stage: deploy
  image: bitnami/kubectl:1.28
  environment:
    name: production
    url: https://portfolio.example.com
  script:
    - kubectl config use-context production
    - kubectl set image deployment/portfolio-service
        portfolio-service=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
        -n $KUBERNETES_NAMESPACE
    - kubectl rollout status deployment/portfolio-service
        -n $KUBERNETES_NAMESPACE
        --timeout=300s
  when: manual
  only:
    - main
    - tags

etl-pipeline:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install -r migration/phase1/database/etl/requirements.txt
  script:
    - cd migration/phase1/database/etl
    - python run_migration.py --validate-only
  only:
    - main
    - develop
  when: manual
