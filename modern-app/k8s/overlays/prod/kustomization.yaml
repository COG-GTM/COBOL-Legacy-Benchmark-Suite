apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio-modernization-prod

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: portfolio-modernization
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
    target:
      kind: Deployment
      name: portfolio-modernization

configMapGenerator:
  - name: portfolio-config
    behavior: merge
    literals:
      - db.host=postgres-prod-service
      - db.name=portfolio_prod
