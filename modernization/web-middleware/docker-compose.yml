services:
  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --workspaces --include-workspace-root && npm run start:api"
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - .:/app

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --workspaces --include-workspace-root && npm run dev -w web-middleware-client -- --host 0.0.0.0"
    environment:
      API_URL: http://api:4000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - .:/app
