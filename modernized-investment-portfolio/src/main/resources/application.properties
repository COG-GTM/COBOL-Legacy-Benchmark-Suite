# =============================================================================
# Modernized Investment Portfolio Management System
# Spring Boot Application Configuration
#
# Migrated from Enterprise COBOL / DB2 for z/OS
# =============================================================================

# --- PostgreSQL DataSource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investment_portfolio}
spring.datasource.username=${DB_USERNAME:portfolio_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool ---
# Matches the original DB2 connection pool configuration (PORTPLAN.sql)
# Max 100 connections, 300s (5 min) connection timeout
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.connection-timeout=300000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=InvestmentPortfolioPool

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
