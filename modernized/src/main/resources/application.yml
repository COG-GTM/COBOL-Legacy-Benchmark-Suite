spring:
  application:
    name: position-update-service

  # --- Development / default profile: H2 in-memory ---
  datasource:
    url: jdbc:h2:mem:posdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    # COBOL checkpoint metadata -> Spring Batch JobRepository tables.
    jdbc:
      initialize-schema: always
    # Jobs are launched explicitly (REST / JobLauncher), not at startup,
    # mirroring JCL-scheduled execution.
    job:
      enabled: false

  h2:
    console:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# --- Production profile: PostgreSQL (credentials via environment) ---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/posdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:posapp}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
