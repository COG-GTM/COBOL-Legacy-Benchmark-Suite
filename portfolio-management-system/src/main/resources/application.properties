# =============================================================================
# Investment Portfolio Management System - Application Configuration
# Migrated from COBOL/z/OS to Java 17 + Spring Boot 3.x
# =============================================================================

# Application
spring.application.name=portfolio-management-system

# =============================================================================
# DataSource Configuration (replaces DB2CONN / DB2ONLN)
# HikariCP pool: max=100, timeout=300s (matching COBOL DB2ONLN contract)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;MODE=DB2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.connection-timeout=300000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================================
# JPA / Hibernate Configuration
# =============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# =============================================================================
# Flyway Migration (replaces DB2 DDL from src/database/db2/)
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Spring Batch Configuration (replaces JCL/BCHCTL00)
# =============================================================================
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# =============================================================================
# DB2 Recovery / Retry Configuration (from DB2RECV.cbl lines 19-22)
# WS-MAX-RETRIES = 3, WS-RETRY-INTERVAL = 2 seconds
# EXTERNALIZED - do NOT hardcode these values
# =============================================================================
portfolio.db2.retry.max-attempts=3
portfolio.db2.retry.interval-ms=2000

# =============================================================================
# Batch Pipeline Configuration
# Daily at 18:00 (from system-architecture.md lines 469-476)
# =============================================================================
portfolio.batch.schedule.cron=0 0 18 * * ?
portfolio.batch.commit-interval=1000
portfolio.batch.max-errors=100
portfolio.batch.rc-threshold=4

# =============================================================================
# Security Configuration (replaces SECMGR/RACF)
# =============================================================================
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN,USER

# =============================================================================
# Actuator / Metrics (replaces UTLMON00, DB2STAT)
# =============================================================================
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# =============================================================================
# Logging
# =============================================================================
logging.level.com.portfolio=INFO
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.security=INFO

# =============================================================================
# H2 Console (for development/testing)
# =============================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
