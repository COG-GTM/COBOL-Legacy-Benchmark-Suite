# Test Configuration
spring.application.name=portfolio-management-system-test

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=DB2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=300000

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# DB2 Recovery (from DB2RECV.cbl lines 19-22)
portfolio.db2.retry.max-attempts=3
portfolio.db2.retry.interval-ms=2000

# Batch
portfolio.batch.schedule.cron=0 0 18 * * ?
portfolio.batch.commit-interval=100
portfolio.batch.max-errors=10
portfolio.batch.rc-threshold=4

# Security
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN,USER

# Actuator
management.endpoints.web.exposure.include=health,metrics,info,prometheus
