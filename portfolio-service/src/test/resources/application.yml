spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

portfolio:
  batch:
    commit-frequency: 10
    max-errors: 5
    max-restarts: 3
    chunk-size: 5
