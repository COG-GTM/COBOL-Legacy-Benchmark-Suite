[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investment-portfolio-manager"
version = "0.1.0"
description = "Python migration of the COBOL Legacy Benchmark Suite Investment Portfolio Management System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2.0",
    "apscheduler",
    "python-jose[cryptography]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "reportlab",
    "jinja2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
