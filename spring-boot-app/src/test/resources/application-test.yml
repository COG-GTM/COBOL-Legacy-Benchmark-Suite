spring:
  datasource:
    url: jdbc:h2:mem:clbs_portfolio_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  batch:
    jdbc:
      initialize-schema: always
  flyway:
    enabled: true
    locations: classpath:db/migration
