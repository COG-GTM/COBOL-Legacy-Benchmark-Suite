spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

report:
  output-directory: ./test-reports
  date-format: yyyy-MM-dd
  retention-days: 90

monitoring:
  thresholds:
    batch-job-duration-warning-ms: 300000
    batch-job-duration-critical-ms: 600000
    error-rate-warning: 5.0
    error-rate-critical: 10.0
    db-query-duration-warning-ms: 1000
    db-query-duration-critical-ms: 5000

maintenance:
  archive:
    retention-days: 365
  cleanup:
    checkpoint-retention-days: 30
    error-log-retention-days: 90

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
