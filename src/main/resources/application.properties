# =============================================================================
# Portfolio Management System - Application Configuration
# Migrated from COBOL Legacy Benchmark Suite
# =============================================================================

# Application
spring.application.name=portfolio-management-system

# Database Configuration (replacing EXEC SQL CONNECT TO POSMVP)
# H2 for testing/development
spring.datasource.url=jdbc:h2:mem:posmvp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Schema initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Batch Configuration (from CKPRST.cpy defaults)
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
batch.commit-interval=1000
batch.max-errors=100
batch.max-restarts=3

# Retry Configuration (from DB2RECV retry logic)
retry.max-attempts=3
retry.interval-ms=2000

# Server Configuration
server.port=8080

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Logging
logging.level.com.cobolbenchmark=INFO
logging.level.org.springframework.batch=INFO
