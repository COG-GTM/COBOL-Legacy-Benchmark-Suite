spring:
  application:
    name: clbs-portfolio-service
  datasource:
    url: jdbc:h2:mem:clbs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

clbs:
  security:
    viewer-username: ${CLBS_VIEWER_USERNAME:viewer}
    viewer-password: ${CLBS_VIEWER_PASSWORD:}
    operator-username: ${CLBS_OPERATOR_USERNAME:operator}
    operator-password: ${CLBS_OPERATOR_PASSWORD:}
    require-passwords: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: CLBS Portfolio Service
    java: ${java.version}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.clbs.portfolio: INFO
