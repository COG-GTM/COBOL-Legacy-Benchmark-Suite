[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clbs-python-translation"
version = "0.1.0"
description = "Python translation pairs for the COBOL Legacy Benchmark Suite"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
